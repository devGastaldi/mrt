<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Prueba</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:Arial,sans-serif; background:linear-gradient(135deg,#0f172a,#2563eb); padding:20px; }
    .card { width:100%; max-width:420px; background:#fff; padding:32px; border-radius:18px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
    h1 { margin:0 0 24px; text-align:center; color:#172033; }
    label { display:block; margin-bottom:8px; color:#374151; font-weight:600; }
    input { width:100%; padding:13px 14px; border:1px solid #cbd5e1; border-radius:10px; font-size:16px; outline:none; transition:.2s; }
    input:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.15); }
    button { width:100%; margin-top:16px; padding:13px; border:0; border-radius:10px; background:#2563eb; color:#fff; font-size:16px; font-weight:700; cursor:pointer; transition:.2s; }
    button:hover { background:#1d4ed8; transform:translateY(-1px); }
    #mensaje { display:none; margin-top:20px; padding:14px; border-radius:10px; background:#eff6ff; color:#1d4ed8; text-align:center; font-weight:700; }
  </style>
</head>
<body>
  <main class="card">
    <h1>HTML Prueba</h1>
    <label for="nombre">Ingresa tu nombre</label>
    <input id="nombre" type="text" placeholder="Ej.: Elvis" autocomplete="name">
    <button id="aceptar" type="button">Aceptar</button>
    <div id="mensaje" role="status"></div>
  </main>

  <script>
    const nombre = document.getElementById('nombre');
    const mensaje = document.getElementById('mensaje');

    function saludar() {
      const valor = nombre.value.trim();
      mensaje.textContent = valor ? `Hola ${valor}` : 'Por favor, ingresa tu nombre.';
      mensaje.style.display = 'block';
    }

    document.getElementById('aceptar').addEventListener('click', saludar);
    nombre.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') saludar();
    });
  </script>
</body>
</html>
